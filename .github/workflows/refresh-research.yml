name: Refresh ORCID research cache

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Refresh ORCID data
        run: node scripts/fetch-orcid.mjs
      - name: Commit changed cache
        run: |
          if git diff --quiet -- src/data/research.json; then
            echo "No research changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/research.json
          git commit -m "chore: refresh ORCID research data"
          git push
